# A diagonal trajectory with an obstacle blocking station "far"'s line of sight
# during t~3.5-5.0s (geometric occlusion, not a timed dropout) - the GlobalTrack stays CONFIRMED via station "close" and resumes "far" once visibility returns.

simulation:
  scenario_id: final_visual_occlusion
  split: final
  duration: 10.0
  seed: 42

uavs:
  - name: uav_1
    initial_state: [0.0, 0.0, 100.0, 10.0, 10.0, 0.0]

stations:
  - id: close
    position: [80.0, 90.0]
    frequency_hz: 35
    position_std: 2.0
    velocity_std: 0.5
  - id: far
    position: [95.0, 10.0]
    frequency_hz: 35
    position_std: 2.0
    velocity_std: 0.5

obstacles:
  - center: [55.0, 35.0]
    radius: 10.0
