# uav_loop performs a real loop (straight 2s, then a sustained 0.55 rad/s turn for
# 6s, ~189 degrees) crossing uav_straight's path again (~3m minimum distance at t~8.1s).

simulation:
  scenario_id: final_loop_crossing
  split: final
  duration: 10.0
  seed: 42

uavs:
  - name: uav_straight
    initial_state: [70.0, 0.0, 100.0, -14.0, 0.0, 0.0]
  - name: uav_loop
    initial_state: [10.0, -30.0, 100.0, 2.0, 15.0, 0.0]
    turn_schedule:
      - duration_s: 2.0
        omega: 0.0
      - duration_s: 6.0
        omega: 0.55

stations:
  - id: N
    position: [0.0, 70.0]
    frequency_hz: 60
    position_std: 2.0
    velocity_std: 0.5
  - id: SW
    position: [-70.0, -75.0]
    frequency_hz: 35
    position_std: 2.0
    velocity_std: 0.5
  - id: E
    position: [75.0, -10.0]
    frequency_hz: 20
    position_std: 2.0
    velocity_std: 0.5
