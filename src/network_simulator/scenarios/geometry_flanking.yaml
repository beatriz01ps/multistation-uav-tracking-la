# Straight trajectory flanked by stations on both sides (one north, two south).
# Expected: one consistent GlobalTrack, all three stations contributing throughout.

simulation:
  scenario_id: final_geometry_flanking
  split: final
  duration: 10.0
  seed: 42

uavs:
  - name: uav_1
    initial_state: [0.0, 50.0, 100.0, 10.0, 0.0, 0.0]

stations:
  - id: A
    position: [50.0, 90.0]
    frequency_hz: 35
    position_std: 2.0
    velocity_std: 0.5
  - id: B
    position: [20.0, 10.0]
    frequency_hz: 35
    position_std: 2.0
    velocity_std: 0.5
  - id: C
    position: [80.0, 10.0]
    frequency_hz: 35
    position_std: 2.0
    velocity_std: 0.5
