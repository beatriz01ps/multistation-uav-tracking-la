# GAP_HORIZON G1: 1 UAV, pure Constant Velocity, duration 120s, reacquisition
# fixed at t=80s - not part of the 13 FINAL scenarios. Blackout applied offline afterward, never in this YAML.

simulation:
  scenario_id: gap_horizon_1uav_straight
  duration: 120.0
  seed: 5001

uavs:
  - name: uav_1
    initial_state: [0.0, 0.0, 100.0, 10.0, 3.0, 0.0]

stations:
  - id: A
    frequency_hz: 60
    position_std: 2.0
    velocity_std: 0.5
  - id: B
    frequency_hz: 35
    position_std: 4.0
    velocity_std: 0.8
  - id: C
    frequency_hz: 20
    position_std: 6.0
    velocity_std: 1.0
