# 5 UAVs crossing near the origin nearly simultaneously (2 maneuvering via CT),
# with an obstacle at the crossing center - stresses gating, DuplicateTrackMerger, and fusion under partial occlusion all at once.

simulation:
  scenario_id: final_extreme_dense_swarm_crossing
  split: final
  duration: 10.0
  seed: 123

uavs:
  - name: uav_n_to_s
    initial_state: [0.0, 70.0, 100.0, 0.0, -14.0, 0.0]
  - name: uav_s_to_n
    initial_state: [5.0, -70.0, 100.0, -1.0, 14.0, 0.0]
  - name: uav_w_to_e
    initial_state: [-70.0, -5.0, 100.0, 14.0, 1.0, 0.0]
  - name: uav_e_to_w_turning
    initial_state: [70.0, 5.0, 100.0, -13.0, 0.0, 0.0]
    turn_schedule:
      - duration_s: 2.5
        omega: 0.0
      - duration_s: 5.0
        omega: 0.45
  - name: uav_diag_turning
    initial_state: [-55.0, -55.0, 100.0, 11.0, 11.0, 0.0]
    turn_schedule:
      - duration_s: 3.0
        omega: 0.0
      - duration_s: 5.0
        omega: -0.4

stations:
  - id: N
    position: [0.0, 90.0]
    frequency_hz: 50
    position_std: 2.0
    velocity_std: 0.6
  - id: SW
    position: [-90.0, -90.0]
    frequency_hz: 50
    position_std: 2.0
    velocity_std: 0.6
  - id: SE
    position: [90.0, -90.0]
    frequency_hz: 35
    position_std: 2.5
    velocity_std: 0.7
  - id: NW
    position: [-90.0, 90.0]
    frequency_hz: 35
    position_std: 2.5
    velocity_std: 0.7

obstacles:
  - center: [0.0, 0.0]
    radius: 10.0
