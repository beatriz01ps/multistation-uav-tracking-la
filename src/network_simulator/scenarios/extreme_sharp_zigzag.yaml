# A single fast UAV alternating tight turns (omega up to 1.2 rad/s, 1.5s segments) -
# designed to separate EKF from UKF under Coordinated Turn, since a faster/larger omega change should make EKF's frozen-Jacobian linearization diverge more from UKF's sigma points.

simulation:
  scenario_id: final_extreme_sharp_zigzag
  split: final
  duration: 12.0
  seed: 7

uavs:
  - name: uav_zigzag
    initial_state: [-60.0, -60.0, 100.0, 15.0, 15.0, 0.0]  # ~21.2 m/s
    turn_schedule:
      - duration_s: 1.0
        omega: 0.0
      - duration_s: 1.5
        omega: 1.2
      - duration_s: 1.5
        omega: -1.2
      - duration_s: 1.5
        omega: 1.2
      - duration_s: 1.5
        omega: -1.2
      - duration_s: 1.5
        omega: 1.2
      - duration_s: 1.5
        omega: -1.2

stations:
  - id: N
    position: [0.0, 80.0]
    frequency_hz: 60
    position_std: 1.5
    velocity_std: 0.5
  - id: S
    position: [0.0, -80.0]
    frequency_hz: 60
    position_std: 1.5
    velocity_std: 0.5
  - id: E
    position: [80.0, 0.0]
    frequency_hz: 35
    position_std: 1.5
    velocity_std: 0.5
