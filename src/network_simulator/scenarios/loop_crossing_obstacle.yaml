# Same loop as loop_crossing.yaml plus a second straight UAV crossing at (0,0) at
# t=5s and an obstacle near the crossing - station SW loses line of sight to each UAV in a different window as they pass behind it.

simulation:
  scenario_id: final_loop_crossing_obstacle
  split: final
  duration: 10.0
  seed: 42

uavs:
  - name: uav_straight_1
    initial_state: [70.0, 0.0, 100.0, -14.0, 0.0, 0.0]
  - name: uav_straight_2
    initial_state: [-70.0, -60.0, 100.0, 14.0, 12.0, 0.0]
  - name: uav_loop
    initial_state: [10.0, -30.0, 100.0, 2.0, 15.0, 0.0]
    turn_schedule:
      - duration_s: 2.0
        omega: 0.0
      - duration_s: 6.0
        omega: 0.55

stations:
  - id: N
    position: [0.0, 70.0]
    frequency_hz: 60
    position_std: 2.0
    velocity_std: 0.5
  - id: SW
    position: [-70.0, -75.0]
    frequency_hz: 35
    position_std: 2.0
    velocity_std: 0.5
  - id: E
    position: [75.0, -10.0]
    frequency_hz: 20
    position_std: 2.0
    velocity_std: 0.5

obstacles:
  - center: [0.0, 10.0]
    radius: 15.0
